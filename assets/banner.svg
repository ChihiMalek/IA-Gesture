<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="45%" stop-color="#101B34"/>
      <stop offset="100%" stop-color="#12243D"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#00A98F"/>
      <stop offset="100%" stop-color="#F7931E"/>
    </linearGradient>
    <pattern id="circuitPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 H20 M40 30 H60 M30 0 V20 M30 40 V60" stroke="#2A3B5C" stroke-width="1.5" fill="none"/>
      <circle cx="30" cy="30" r="3" fill="#2A3B5C"/>
      <circle cx="20" cy="30" r="2" fill="#2A3B5C"/>
      <circle cx="40" cy="30" r="2" fill="#2A3B5C"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGradient)"/>
  <rect width="1280" height="320" fill="url(#circuitPattern)" opacity="0.35"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGradient)"/>

  <!-- Hand / gesture icon (left) -->
  <g transform="translate(70,90)" fill="none" stroke="#4285F4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 130 C20 130 10 110 10 90 L10 55 C10 48 16 42 23 42 C30 42 36 48 36 55 L36 80"/>
    <path d="M36 55 L36 30 C36 23 42 17 49 17 C56 17 62 23 62 30 L62 80"/>
    <path d="M62 30 L62 20 C62 13 68 7 75 7 C82 7 88 13 88 20 L88 80"/>
    <path d="M88 25 C88 18 94 12 101 12 C108 12 114 18 114 25 L114 95 C114 118 100 138 76 138 L58 138 C44 138 34 132 26 122 L6 98"/>
    <circle cx="49" cy="105" r="3" fill="#4285F4" stroke="none"/>
    <circle cx="76" cy="105" r="3" fill="#00A98F" stroke="none"/>
    <circle cx="101" cy="105" r="3" fill="#F7931E" stroke="none"/>
  </g>

  <!-- Signal / MQTT waves -->
  <g transform="translate(230,150)" stroke="#00A98F" stroke-width="3" fill="none" opacity="0.85">
    <path d="M0 20 Q15 0 30 20 T60 20"/>
    <path d="M0 35 Q15 15 30 35 T60 35" opacity="0.6"/>
  </g>

  <!-- Chip / embedded icon (right side, behind text) -->
  <g transform="translate(1060,110)" opacity="0.9">
    <rect x="0" y="0" width="90" height="90" rx="8" fill="none" stroke="#F7931E" stroke-width="3"/>
    <rect x="20" y="20" width="50" height="50" rx="4" fill="#F7931E" opacity="0.15" stroke="#F7931E" stroke-width="2"/>
    <g stroke="#F7931E" stroke-width="3">
      <line x1="20" y1="-12" x2="20" y2="0"/>
      <line x1="45" y1="-12" x2="45" y2="0"/>
      <line x1="70" y1="-12" x2="70" y2="0"/>
      <line x1="20" y1="90" x2="20" y2="102"/>
      <line x1="45" y1="90" x2="45" y2="102"/>
      <line x1="70" y1="90" x2="70" y2="102"/>
      <line x1="-12" y1="20" x2="0" y2="20"/>
      <line x1="-12" y1="45" x2="0" y2="45"/>
      <line x1="-12" y1="70" x2="0" y2="70"/>
      <line x1="90" y1="20" x2="102" y2="20"/>
      <line x1="90" y1="45" x2="102" y2="45"/>
      <line x1="90" y1="70" x2="102" y2="70"/>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F5F7FA">
    IA Gesture
  </text>

  <!-- Subtitle -->
  <text x="402" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#9FB0C9">
    Real-Time Hand-Gesture Recognition &amp; IoT Assistive System
  </text>

  <!-- Tag pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="402" y="205" width="120" height="30" rx="15" fill="#4285F433" stroke="#4285F4" stroke-width="1"/>
    <text x="422" y="225" fill="#8FB4FF">Computer Vision</text>

    <rect x="534" y="205" width="150" height="30" rx="15" fill="#00A98F33" stroke="#00A98F" stroke-width="1"/>
    <text x="554" y="225" fill="#7FE0CC">Machine Learning</text>

    <rect x="696" y="205" width="90" height="30" rx="15" fill="#66006633" stroke="#B266FF" stroke-width="1"/>
    <text x="716" y="225" fill="#D9AFFF">MQTT / IoT</text>

    <rect x="798" y="205" width="150" height="30" rx="15" fill="#F7931E33" stroke="#F7931E" stroke-width="1"/>
    <text x="818" y="225" fill="#FFC177">Embedded Systems</text>
  </g>

  <!-- Bottom credit line -->
  <text x="402" y="270" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E7290">
    ENIG — Génie Électrique et Automatique · OpenCV · MediaPipe · scikit-learn · ESP32 / ESP8266
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="314" width="1280" height="6" fill="url(#accentGradient)"/>
</svg>
